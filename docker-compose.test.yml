services:
  test_db:
    image: postgres:15-alpine
    container_name: silver_test_db
    environment:
      POSTGRES_DB: silver_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - test_postgres_data:/var/lib/postgresql/data

volumes:
  test_postgres_data: